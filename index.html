<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #dda7da;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .container {
      background: white;
      padding: 25px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-top: 0;
    }
    .input-area {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #b94f94;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #c70289; }

    ul { padding: 0; }
    li {
      list-style: none;
      background: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .delete-btn {
      background: #ef4444;
      padding: 4px 8px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .delete-btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <h2>To-Do List</h2>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Tambahkan tugas..." />
      <button id="addBtn">Tambah</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");

    function addTask() {
      const text = taskInput.value.trim();
      if (text === "") return alert("Isi dulu tugasnya!");

      const li = document.createElement("li");
      li.textContent = text;

      const del = document.createElement("button");
      del.textContent = "Hapus";
      del.className = "delete-btn";
      del.onclick = () => li.remove();

      li.appendChild(del);
      taskList.appendChild(li);

      taskInput.value = "";
    }

    addBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });
  </script>
</body>
</html>
